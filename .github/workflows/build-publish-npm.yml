name: Publish NPM Package
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-pre.[0-9]+"
permissions:
  id-token: write  # Required for OIDC
  contents: read
jobs:
  get_semver:
    name: Create semver
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit is on master for safety
        run: git branch --remote --contains | grep origin/master

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: "5.x"
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.7
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
  build_and_publish:
    name: Build centeva-angular
    runs-on: [self-hosted, linux]
    needs: get_semver
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Version
        run: |
          cd ./projects/centeva-core
          npm version ${{ needs.get_semver.outputs.semVer }} --git-tag-version=false
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Publish
        run: |
          # OIDC will automatically authenticate if no manual token config is set
          npm publish ./dist/centeva-core --access public --no-git-tag-version --ignore-scripts
