name: Publish NPM Package
on:
  push:
    branches:
      - "master"
permissions:
  id-token: write  # Required for OIDC
  contents: read
jobs:
  get_semver:
    name: Create semver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: "5.x"
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.7
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
  build_and_publish:
    name: Build centeva-angular
    runs-on: ubuntu-latest
    needs: get_semver
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Version
        run: |
          cd ./projects/centeva-core
          npm version ${{ needs.get_semver.outputs.semVer }} --git-tag-version=false
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Publish
        run: |
          # OIDC will automatically authenticate if no manual token config is set
          npm publish ./dist/centeva-core --access public --no-git-tag-version --ignore-scripts
  create_tag:
    name: Push github tag
    runs-on: ubuntu-latest
    needs:
      - get_semver
      - build_and_publish
    permissions:
      contents: write
    steps:
      - name: Create tag
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/${{ needs.get_semver.outputs.semVer }}",
              sha: context.sha
            })
